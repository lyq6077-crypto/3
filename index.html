<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會考 6 級分寫作導師</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 引入 Google Fonts (明體字型) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink-color: #3f3a36;
            --accent-color: #8c6a49;
            --paper-bg: #fdfbf7;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--paper-bg);
            /* 柔和的羊皮紙/米色背景紋理感 */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d7d3c8' fill-opacity='0.2'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: var(--ink-color);
        }
        
        .paper-container {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 40px -10px rgba(168, 159, 145, 0.4), 0 0 20px rgba(168, 159, 145, 0.1);
        }

        .title-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #c5b4a0, transparent);
            margin: 2rem 0;
        }

        /* 輸入框樣式 */
        .elegant-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #c5b4a0;
            border-radius: 0;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .elegant-input:focus {
            border-bottom-color: var(--accent-color);
        }

        /* 統一 Markdown 渲染樣式 */
        .markdown-body p {
            text-indent: 2em;
            line-height: 2.2;
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
            text-align: justify;
        }
        .markdown-body strong {
            color: var(--accent-color);
            font-weight: 600;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 3em;
            margin-bottom: 1.5rem;
            line-height: 2;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body li { margin-bottom: 0.5rem; }
        .markdown-body li p { text-indent: 0; margin-bottom: 0; }

        /* 滿分範文專屬樣式 (首字放大) */
        #essay-content-render p:first-of-type::first-letter {
            font-size: 3.5em;
            float: left;
            margin-top: -0.1em;
            margin-right: 0.15em;
            margin-bottom: -0.2em;
            line-height: 1;
            color: var(--accent-color);
            font-weight: 700;
        }

        /* Loading 動畫 */
        .loader {
            border: 3px solid rgba(200, 180, 160, 0.3);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .section-header {
            position: relative;
            display: inline-block;
        }
        .section-header::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--accent-color);
            opacity: 0.2;
        }
    </style>
</head>
<body class="antialiased min-h-screen py-10 px-4 md:py-16 selection:bg-amber-200 selection:text-amber-900 flex flex-col items-center">

    <!-- 頂部標題與輸入區 -->
    <header class="w-full max-w-3xl text-center mb-10">
        <h2 class="text-sm md:text-base text-amber-700 tracking-[0.2em] mb-3 font-semibold">專屬你的文學與寫作指導</h2>
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-stone-800 tracking-wider mb-8">會考 6 級分寫作導師</h1>
        
        <div class="paper-container rounded-lg p-6 md:p-8 flex flex-col md:flex-row gap-4 items-center justify-center relative overflow-hidden">
            <!-- 裝飾線 -->
            <div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-amber-800/20 m-2 pointer-events-none"></div>
            <div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-amber-800/20 m-2 pointer-events-none"></div>

            <input type="text" id="topicInput" placeholder="請輸入作文題目 (例如：暑假最難忘的回憶)" 
                class="elegant-input w-full md:w-2/3 text-lg md:text-xl py-2 px-4 text-center text-stone-700 placeholder-stone-400"
                autocomplete="off">
            <button id="submitBtn" onclick="generateGuidance()" 
                class="w-full md:w-auto bg-[#8c6a49] hover:bg-[#725438] text-white px-6 py-2.5 rounded shadow-md transition duration-300 text-lg tracking-widest flex items-center justify-center gap-2">
                <span>請老師指導</span>
            </button>
        </div>
        <div id="error-message" class="text-red-700 mt-4 text-sm hidden"></div>
    </header>

    <!-- 指導內容展示區 (預設隱藏) -->
    <main id="resultArea" class="w-full max-w-4xl hidden flex-col gap-10">
        
        <!-- 第一區：趨勢分析 -->
        <section class="paper-container rounded-sm border border-stone-200 p-8 md:p-10 relative overflow-hidden">
            <h3 class="text-2xl font-bold text-stone-800 mb-6 section-header tracking-wider">一、趨勢分析與破題指南</h3>
            <div id="trend-content" class="markdown-body text-lg text-stone-700"></div>
        </section>

        <!-- 第二區：滿分範文 (最華麗的區塊) -->
        <section class="paper-container rounded-sm border border-stone-200 p-8 md:p-16 lg:p-20 relative overflow-hidden">
            <!-- 角落裝飾 -->
            <div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-amber-800/10 m-4 rounded-tl-lg pointer-events-none"></div>
            <div class="absolute bottom-0 right-0 w-16 h-16 border-b-4 border-r-4 border-amber-800/10 m-4 rounded-br-lg pointer-events-none"></div>

            <div class="text-center mb-10">
                <h3 class="text-sm md:text-base text-amber-700 tracking-[0.2em] mb-2 font-semibold">示範篇章</h3>
                <h2 id="essay-title" class="text-3xl md:text-4xl font-bold text-stone-800 tracking-wider mb-4"></h2>
                <div class="title-divider"></div>
            </div>
            
            <article id="essay-content-render" class="markdown-body text-lg md:text-xl text-stone-800"></article>
        </section>

        <!-- 第三區：滿分秘訣解析 -->
        <section class="paper-container rounded-sm border border-stone-200 p-8 md:p-10 relative overflow-hidden">
            <h3 class="text-2xl font-bold text-stone-800 mb-6 section-header tracking-wider">三、滿分秘訣解析</h3>
            <div id="secrets-content" class="markdown-body text-lg text-stone-700"></div>
            
            <div class="mt-12 text-center">
                <span class="inline-block w-1.5 h-1.5 bg-amber-800/30 rounded-full mx-1"></span>
                <span class="inline-block w-1.5 h-1.5 bg-amber-800/30 rounded-full mx-1"></span>
                <span class="inline-block w-1.5 h-1.5 bg-amber-800/30 rounded-full mx-1"></span>
            </div>
            <p class="text-center text-stone-500 text-sm tracking-wider mt-4">用心感受生活，寫出真摯動人的文字。</p>
        </section>

    </main>

    <script>
        // API 設定
        const apiKey = ""; // Canvas 運行環境會自動注入
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        // 系統提示詞
        const systemPrompt = `Role: 你是一位精通台灣國中教育會考寫作測驗的首席閱卷王牌老師，同時也是一位頂尖的文學作家。任務是引導學生寫出達到6級分的滿分範文，並傳授寫作秘訣。
Workflow: 當使用者輸入作文題目時，請嚴格執行三個步驟：
1. 趨勢分析: 分析核心概念與容易流於俗套的陷阱。
2. 6級分滿分範文: 撰寫約600-800字的示範文章。立意獨特、情感真摯，運用多元句型與豐富修辭，嚴格遵守標點符號與分段(通常為4段)。
3. 滿分秘訣解析: 包含【破題思維】、【修辭亮點】(挑2-3句解釋)、【結構佈局】。
Tone: 語氣必須兼具專業、鼓勵性與文學素養。`;

        // 綁定 Enter 鍵送出
        document.getElementById('topicInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                generateGuidance();
            }
        });

        async function generateGuidance() {
            const topicInput = document.getElementById('topicInput');
            const topic = topicInput.value.trim();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error-message');
            const resultArea = document.getElementById('resultArea');
            
            if (!topic) {
                topicInput.focus();
                return;
            }

            // UI 狀態切換為 Loading
            btn.disabled = true;
            btn.innerHTML = `<div class="loader"></div> <span class="ml-2">老師構思中...</span>`;
            errorDiv.classList.add('hidden');
            resultArea.classList.add('hidden');

            const payload = {
                contents: [{ parts: [{ text: `請指導我的作文題目：${topic}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    // 為了完美分段顯示，使用 JSON Schema 強制模型輸出結構化的 3 個欄位
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "trend_analysis": { type: "STRING", description: "趨勢分析（核心概念與陷阱），可使用 Markdown 標示粗體或列點。" },
                            "essay": { type: "STRING", description: "6級分滿分範文內文。請注意：只需要正文，段落與段落之間使用兩個換行符號 (\\n\\n) 隔開。" },
                            "secrets_analysis": { type: "STRING", description: "滿分秘訣解析（破題思維、修辭亮點、結構佈局），可使用 Markdown 標示粗體或列點。" }
                        },
                        required: ["trend_analysis", "essay", "secrets_analysis"]
                    }
                }
            };

            try {
                // 指數退避重試邏輯
                let response = null;
                let retries = 3;
                let delay = 1000;

                for (let i = 0; i < retries; i++) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) break;
                    
                    if (i < retries - 1) {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }

                if (!response || !response.ok) {
                    throw new Error("API 請求失敗，請稍後再試。");
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts) {
                    const jsonText = result.candidates[0].content.parts[0].text;
                    const parsedData = JSON.parse(jsonText);

                    // 渲染內容
                    document.getElementById('essay-title').textContent = `《 ${topic} 》`;
                    
                    // 使用 marked 解析 Markdown 並放入對應的區塊
                    document.getElementById('trend-content').innerHTML = marked.parse(parsedData.trend_analysis);
                    // 範文區塊將段落轉換，讓 CSS 首字放大與縮排能正確作用
                    document.getElementById('essay-content-render').innerHTML = marked.parse(parsedData.essay);
                    document.getElementById('secrets-content').innerHTML = marked.parse(parsedData.secrets_analysis);

                    // 顯示結果
                    resultArea.classList.remove('hidden');
                    
                    // 網頁平滑向下捲動至結果區
                    setTimeout(() => {
                        resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);

                } else {
                    throw new Error("無法解析老師的回應，請再試一次。");
                }

            } catch (error) {
                errorDiv.textContent = error.message || "發生未知錯誤，請重試。";
                errorDiv.classList.remove('hidden');
            } finally {
                // 恢復按鈕狀態
                btn.disabled = false;
                btn.innerHTML = `<span>請老師指導</span>`;
            }
        }
    </script>
</body>
</html>
